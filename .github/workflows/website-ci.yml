name: Website CI

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'scripts/github_publication/**'
      - 'publication/phase6/**'
      - 'requirements/phase4/**'
      - '.github/workflows/website-ci.yml'
  pull_request:
    paths:
      - 'website/**'
      - 'scripts/github_publication/**'
      - 'publication/phase6/**'
      - 'requirements/phase4/**'
      - '.github/workflows/website-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  website:
    name: Website build and saved-source regressions
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - name: Configure Windows path and byte handling
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.longpaths true
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify source before website checks
        shell: pwsh
        run: |
          python -I -B scripts/github_publication/verify_phase6.py --require-clean
          if ($LASTEXITCODE -ne 0) { throw 'Source integrity failed' }
      - name: Python installer safety without scientific installation
        shell: pwsh
        run: |
          python -I -B scripts/github_publication/test_python_installation.py
          if ($LASTEXITCODE -ne 0) { throw 'Python installer guards failed' }
      - name: Validate the website in a disposable copy
        shell: pwsh
        run: |
          & ./scripts/github_publication/phase6/run_website_ci.ps1 -AuditRoot (Join-Path $env:RUNNER_TEMP 'flamel-website-ci')
      - name: Verify original source and accepted evidence remain unchanged
        if: always()
        shell: pwsh
        run: |
          python -I -B scripts/github_publication/verify_phase6.py --require-clean
          if ($LASTEXITCODE -ne 0) { throw 'Source integrity changed' }
